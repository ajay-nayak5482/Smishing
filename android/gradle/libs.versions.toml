[versions]
agp = "8.10.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.12.0"
constraintlayout = "2.2.1"
tensorflowLite = "2.10.0"
tensorflowLiteSupport = "0.4.0"
gson = "2.11.0"
carview = "1.0.0"
opencsv="5.9"


[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }

tensorflow-lite = { group = "org.tensorflow", name = "tensorflow-lite", version.ref = "tensorflowLite" }

# Optional: TensorFlow Lite Support Library (includes NNAPI delegate and helper utilities)
tensorflow-lite-support = { group = "org.tensorflow", name = "tensorflow-lite-support", version.ref = "tensorflowLiteSupport" }

# Optional: TensorFlow Lite Task Library for Vision (example)
tensorflow-lite-taskText = { group = "org.tensorflow", name = "tensorflow-lite-task-text", version.ref = "tensorflowLiteSupport" }
# tensorflow-lite-selectTFOps = { group = "org.tensorflow", name = "tensorflow-lite-select-tf-ops" }

gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
cardview = { group = "androidx.cardview", name = "cardview", version.ref = "carview" }
opencsv = { group = "com.opencsv", name = "opencsv", version.ref = "opencsv" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }

